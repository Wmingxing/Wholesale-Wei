<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grocery & Wholesale - My Store</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/grocery.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo"><a href="index.html">MY STORE</a></div>
            <ul class="nav-links" style="list-style:none; display:flex; gap:30px;">
                <li><a href="index.html" >Home</a></li>
                <li><a href="wig-category.html" >Human Hair Wigs</a></li>
                <li><a href="grocery.html" >Grocery Wholesale</a></li>
                <li><a href="best-sellers.html" >Best Sellers</a></li>
                <li><a href="support.html" >Customer Support</a></li>
            </ul>
            <div class="nav-icons">
                <button class="cart-btn-nav" onclick="toggleCartDrawer()">Cart (<span id="cart-count">0</span>)</button>
            </div>
        </div>
    </header>

    <div class="category-header-section">
        <!-- 大标题 -->
        <h1 class="page-main-title">Grocery & Wholesale Collection</h1>

        <!-- 右侧本类目专属搜索框 -->
        <div class="search-bar-container">
            <input type="text" id="grocery-search" class="category-search-input" placeholder="Search grocery..." oninput="handleGrocerySearch()">
        </div>

        <!-- 商品网格容器 -->
        <div id="grocery-grid" class="grocery-grid"></div>
    </div>

    <!-- 购物车抽屉组件 -->
    <div class="cart-drawer-overlay" id="cart-overlay" onclick="toggleCartDrawer()"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header"><span>Your Shopping Cart</span><button class="close-cart" onclick="toggleCartDrawer()">&times;</button></div>
        <div class="cart-items-list" id="cart-items-container"></div>
        <div class="cart-footer">
            <!-- 原价小计 -->
            <div class="cart-total">
                <span>Subtotal</span>
                <span id="cart-subtotal" style="text-decoration: line-through; color: #888; font-size: 14px;">$0.00</span>
            </div>
        
            <!-- 💡 阶梯折后价显示区 -->
            <div class="cart-total discount-row" style="margin-top: 6px;">
                <span style="font-weight: 800; color: #e63946;">Final Price (Tier Discount):</span>
                <span id="cart-discounted-price" style="font-weight: 800; color: #e63946; font-size: 18px;">$0.00</span>
            </div>
        
            <!-- 折扣提示标签 -->
            <div id="cart-discount-notice" style="font-size: 12px; color: #25D366; text-align: right; margin-bottom: 12px; font-weight: 600;">
                Order $100+ for 4% OFF!
            </div>
        
            <!-- 💡 修改后的 WhatsApp 联系结算按钮 -->
            <a href="https://wa.me/86111111" target="_blank" class="checkout-btn whatsapp-btn">
                Contact WhatsApp:<br>
                <strong style="font-size: 15px; letter-spacing: 0.5px;">+86 18339686015/+86 17744478917</strong>
            </a>
        </div>
    </div>

    <script src="../js/database.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        let allGroceryProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            allGroceryProducts = getAllProducts().filter(p => p.category === 'grocery');
            renderGroceryProducts(allGroceryProducts);
        });

        function renderGroceryProducts(productsToRender) {
            const container = document.getElementById('grocery-grid');
            if (productsToRender.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding:40px;">No grocery products found.</p>`;
                return;
            }

            container.innerHTML = productsToRender.map(p => {
                const sz = p.sizes[0];
                return `
                    <div class="product-card">
                        <div onclick="location.href='grocery.html?id=${p.id}'" style="cursor:pointer;">
                            <img src="${p.images[0]}" alt="${p.name}">
                            <div style="font-size:11px; color:#777; text-transform:uppercase; margin-bottom:4px;">Grocery</div>
                            <div class="product-card-title" style="font-size:14px; font-weight:600; height:2.8em; overflow:hidden; margin-bottom:8px;">${p.name}</div>
                            <div style="margin-bottom:8px;">
                                <span class="card-price" style="font-size:16px; font-weight:800; color:#e63946;">$${sz.price.toFixed(2)}</span>
                                ${sz.originalPrice ? `<span class="card-original" style="font-size:12px; color:#888; text-decoration:line-through; margin-left:6px;">$${sz.originalPrice.toFixed(2)}</span>` : ''}
                            </div>
                        </div>
                        <button class="add-btn" onclick="addToCart({
                            id: '${p.id}',
                            name: '${p.name}',
                            price: ${sz.price},
                            size: '${sz.name}',
                            img: '${p.images[0]}'
                        })">Add to Cart</button>
                    </div>
                `;
            }).join('');
        }

        function handleGrocerySearch() {
            const keyword = document.getElementById('grocery-search').value.toLowerCase().trim();
            const filtered = allGroceryProducts.filter(p => p.name.toLowerCase().includes(keyword));
            renderGroceryProducts(filtered);
        }
    </script>
</body>
</html>
